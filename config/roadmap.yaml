enabled: true
title: Research Roadmap
subtitle: Designing Feedback for LLM Post-Training
description: Informative, well-targeted, and trustworthy learning signals.

phases:
  - id: preference_optimization
    title: Preference Optimization
    icon: ⚖️
    summary: Getting more learning signal out of preference data by contrasting related prompts and generating fresh negatives during training.
    stageIds: [preference_optimization]
    maxItems: 3
  - id: reward_allocation
    title: Reward & Exploration Allocation
    icon: 🎯
    summary: Sending reward to the parts of a response or task that still need work, from semantic segments in RLHF to hard instructions in multi-constraint RL.
    stageIds: [reward_allocation]
    maxItems: 3
  - id: grounded_feedback
    title: Verifiable & Grounded Feedback
    icon: 🔍
    summary: Grounding feedback in execution and evidence, and putting it to work in a deployed product.
    stageIds: [verification, deployment]
    maxItems: 6
    columns: 2
    groups:
      - id: verification
        label: Verifiable Data & Verifiers
        icon: 🧪
        row: top
      - id: deployment
        label: "Deployed: SQL Autocomplete"
        icon: 🚀
        row: top

filters:
  - id: alignment
    name: Alignment
  - id: reward
    name: Reward Design
  - id: verification
    name: Verification & Grounding

